# uni-foam.com — static site (no build step).
# Provisioned per fleet pattern (scripts/josh-site-deploy provision-*):
# GitHub MCERQUA/uni-foam -> Netlify build hook; ignore_html_forms MUST stay false
# (set at site level) so Netlify detects the HTML contact form.

[build]
  command = ""
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
